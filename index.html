<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>디카 카메라</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0b0d;--panel:#141416;--fg:#f4efe8;--dim:#8d8880;--accent:#ff8a1f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto}
.stage{position:relative;flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center}
#view{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:block}
#cam{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hud{position:absolute;inset:0;pointer-events:none;font-family:"Courier New",monospace;font-weight:700;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.6)}
.hud .tl{position:absolute;top:12px;left:14px;font-size:13px;letter-spacing:1px}
.hud .tr{position:absolute;top:12px;right:14px;font-size:13px}
.hud .tl i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-right:6px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}
.focus{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);
 background:
 linear-gradient(#fff,#fff) 0 0/14px 2px no-repeat,linear-gradient(#fff,#fff) 0 0/2px 14px no-repeat,
 linear-gradient(#fff,#fff) 100% 0/14px 2px no-repeat,linear-gradient(#fff,#fff) 100% 0/2px 14px no-repeat,
 linear-gradient(#fff,#fff) 0 100%/14px 2px no-repeat,linear-gradient(#fff,#fff) 0 100%/2px 14px no-repeat,
 linear-gradient(#fff,#fff) 100% 100%/14px 2px no-repeat,linear-gradient(#fff,#fff) 100% 100%/2px 14px no-repeat;opacity:.8}
.name{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:2px;color:var(--accent)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:.9;transition:none}
.controls{background:var(--panel);padding:10px 0 calc(14px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid #2c2c30;background:#1c1c20;color:var(--dim);font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-around;padding:0 18px}
.side{width:52px;height:52px;border-radius:14px;border:1px solid #2c2c30;background:#1c1c20;color:var(--fg);font-size:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.side img{width:100%;height:100%;object-fit:cover}
.side.small{font-size:12px;line-height:1.1;text-align:center}
.side.on{border-color:var(--accent);color:var(--accent)}
#shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:0;position:relative}
#shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;transition:transform .1s}
#shutter:active::after{transform:scale(.88)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:10}
.overlay[hidden]{display:none}
.overlay img{max-width:100%;max-height:68dvh;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:12px 20px;border-radius:12px;border:0;background:var(--accent);color:#111;font-weight:700;font-size:15px}
.btn.ghost{background:#26262a;color:var(--fg)}
.hint{color:var(--dim);font-size:12px;margin:0}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="stage">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="view" width="360" height="480"></canvas>
    <div class="hud">
      <div class="tl"><i></i>AUTO</div>
      <div class="tr">▮▮▮▯</div>
      <div class="focus"></div>
      <div class="name" id="pname"></div>
    </div>
    <div id="flash"></div>
  </div>
  <div class="controls">
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="side" id="album" aria-label="앨범">🖼</button>
      <button class="side small on" id="stampBtn" aria-label="날짜">날짜<br>ON</button>
      <button id="shutter" aria-label="촬영"></button>
      <button class="side" id="last" aria-label="마지막 사진" hidden></button>
      <button class="side" id="flip" aria-label="카메라 전환">🔄</button>
    </div>
  </div>
</div>

<div class="overlay" id="msg" hidden>
  <div style="font-size:40px">📷</div>
  <div>카메라를 바로 열 수 없어요.<br>권한을 허용하거나, 아래 방법으로 찍어보세요.</div>
  <div class="btns">
    <button class="btn" id="retry">카메라 다시 켜기</button>
    <button class="btn ghost" id="native">기본 카메라로 찍기</button>
    <button class="btn ghost" id="album2">앨범에서 고르기</button>
  </div>
  <p class="hint">기본 카메라로 찍거나 앨범에서 골라도 똑같이 디카 감성 필터가 적용돼요.</p>
</div>

<div class="overlay" id="viewer" hidden>
  <img id="result" alt="촬영한 사진">
  <div class="btns">
    <button class="btn" id="save">저장 / 공유</button>
    <button class="btn ghost" id="close">닫기</button>
  </div>
  <p class="hint">저장이 안 되면 사진을 길게 눌러 저장하세요.</p>
</div>

<input type="file" id="pickFile" accept="image/*">
<input type="file" id="nativeFile" accept="image/*" capture="environment">

<script>
const $ = s => document.querySelector(s);

// sh: 어두운 곳 색감, hi: 밝은 곳 색감 (RGB 가산)
const PRESETS = [
  {name:'Y2K 디카',  gain:1.10, contrast:1.18, sat:1.12, sh:[-4,2,10],  hi:[10,4,4],   fade:10, grain:14, bloom:.28, vig:.35, flash:.10, soft:.8},
  {name:'CCD 웜',    gain:1.06, contrast:1.08, sat:1.05, sh:[6,2,-4],   hi:[16,8,-6],  fade:16, grain:12, bloom:.30, vig:.30, flash:.06, soft:.8},
  {name:'빈티지 필름',gain:1.00, contrast:1.06, sat:.85,  sh:[-6,8,4],   hi:[14,8,-8],  fade:20, grain:20, bloom:.20, vig:.40, flash:0,   soft:.85},
  {name:'플래시 2000',gain:1.16, contrast:1.26, sat:1.00, sh:[-6,0,10],  hi:[6,4,6],    fade:6,  grain:16, bloom:.20, vig:.45, flash:.28, soft:.8},
  {name:'흑백 CCD',  gain:1.06, contrast:1.22, sat:0,    sh:[0,0,4],    hi:[6,3,0],    fade:12, grain:18, bloom:.25, vig:.35, flash:.05, soft:.85}
];

let cur = 0, facing = 'environment', stamp = true, stream = null, lastBlob = null, lastUrl = null;
const view = $('#view'), vctx = view.getContext('2d', {willReadFrequently:true});
const cam = $('#cam');

// ---------- 임시 캔버스 ----------
const tmps = {};
function tmp(id, w, h){
  let c = tmps[id] || (tmps[id] = document.createElement('canvas'));
  if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  return c;
}

// ---------- 핵심: 디카 룩 렌더링 ----------
function render(ctx, w, h, src, sw, sh, P, mirror, date){
  // 3:4 크롭
  const tr = w / h, sr = sw / sh;
  let cx = 0, cy = 0, cw = sw, ch = sh;
  if (sr > tr){ cw = sh * tr; cx = (sw - cw) / 2; } else { ch = sw / tr; cy = (sh - ch) / 2; }

  // 살짝 낮춘 해상도로 그렸다가 키워서 CCD 특유의 부드러움
  const tw = Math.round(w * P.soft), th = Math.round(h * P.soft);
  const t = tmp('soft', tw, th), tc = t.getContext('2d');
  tc.save();
  if (mirror){ tc.translate(tw, 0); tc.scale(-1, 1); }
  tc.drawImage(src, cx, cy, cw, ch, 0, 0, tw, th);
  tc.restore();
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(t, 0, 0, tw, th, 0, 0, w, h);

  // 블룸 (번지는 하이라이트)
  if (P.bloom){
    const bw = Math.max(2, w >> 3), bh = Math.max(2, h >> 3);
    const b = tmp('bloom', bw, bh), bc = b.getContext('2d');
    bc.imageSmoothingEnabled = true; bc.imageSmoothingQuality = 'high';
    bc.drawImage(ctx.canvas, 0, 0, w, h, 0, 0, bw, bh);
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = P.bloom;
    ctx.drawImage(b, 0, 0, bw, bh, 0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }

  // 픽셀 단위 색보정 + 노이즈
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const g = P.gain, c = P.contrast, s = P.sat, f = P.fade, fk = (255 - f) / 255, gr = P.grain;
  const sh0 = P.sh, hi0 = P.hi;
  for (let i = 0; i < d.length; i += 4){
    let r = d[i] * g, gg = d[i+1] * g, b = d[i+2] * g;
    r = (r - 128) * c + 128; gg = (gg - 128) * c + 128; b = (b - 128) * c + 128;
    const l = .299 * r + .587 * gg + .114 * b;
    r = l + (r - l) * s; gg = l + (gg - l) * s; b = l + (b - l) * s;
    let t2 = l / 255; t2 = t2 < 0 ? 0 : t2 > 1 ? 1 : t2;
    const u = 1 - t2;
    r += sh0[0] * u + hi0[0] * t2;
    gg += sh0[1] * u + hi0[1] * t2;
    b += sh0[2] * u + hi0[2] * t2;
    r = f + r * fk; gg = f + gg * fk; b = f + b * fk;
    const n = (Math.random() - .5) * gr, n2 = (Math.random() - .5) * gr * .35;
    d[i] = r + n + n2; d[i+1] = gg + n; d[i+2] = b + n - n2;
  }
  ctx.putImageData(img, 0, 0);

  // 비네팅
  const vg = ctx.createRadialGradient(w/2, h/2, Math.min(w, h) * .25, w/2, h/2, Math.hypot(w, h) / 2);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,' + P.vig + ')');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);

  // 플래시 핫스팟
  if (P.flash){
    const fg = ctx.createRadialGradient(w/2, h*.5, 0, w/2, h*.5, Math.min(w, h) * .75);
    fg.addColorStop(0, 'rgba(255,245,235,' + P.flash + ')'); fg.addColorStop(1, 'rgba(255,245,235,0)');
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = fg; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
  }

  // 날짜 스탬프
  if (stamp){
    const txt = "'" + String(date.getFullYear()).slice(2) + ' ' + (date.getMonth() + 1) + ' ' + date.getDate();
    const fs = Math.round(h * .036);
    ctx.font = 'italic 700 ' + fs + 'px "Courier New", monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(255,120,20,.9)'; ctx.shadowBlur = fs * .5;
    ctx.fillStyle = '#ff9a2e';
    ctx.fillText(txt, w - w * .05, h - h * .04);
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  }
}

// ---------- 라이브 미리보기 ----------
let last = 0;
function loop(t){
  requestAnimationFrame(loop);
  if (t - last < 40 || cam.readyState < 2 || !cam.videoWidth) return;
  last = t;
  render(vctx, 360, 480, cam, cam.videoWidth, cam.videoHeight, PRESETS[cur], facing === 'user', new Date());
}
requestAnimationFrame(loop);

// ---------- 카메라 ----------
function stopCam(){ if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
async function startCam(){
  stopCam();
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    cam.srcObject = stream; await cam.play();
    $('#msg').hidden = true;
  }catch(e){ $('#msg').hidden = false; }
}

// ---------- 결과 처리 ----------
function showResult(canvas){
  canvas.toBlob(b => {
    lastBlob = b;
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(b);
    $('#result').src = lastUrl;
    const l = $('#last'); l.hidden = false; l.innerHTML = '<img src="' + lastUrl + '" alt="">';
    $('#viewer').hidden = false;
  }, 'image/jpeg', .92);
}
function capture(){
  if (cam.readyState < 2 || !cam.videoWidth) return;
  const f = $('#flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 60);
  if (navigator.vibrate) navigator.vibrate(15);
  const c = document.createElement('canvas'); c.width = 1200; c.height = 1600;
  render(c.getContext('2d', {willReadFrequently:true}), 1200, 1600, cam, cam.videoWidth, cam.videoHeight, PRESETS[cur], facing === 'user', new Date());
  showResult(c);
}
async function fromFile(file){
  if (!file) return;
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){ bmp = await createImageBitmap(file); }
  const c = document.createElement('canvas'); c.width = 1200; c.height = 1600;
  render(c.getContext('2d', {willReadFrequently:true}), 1200, 1600, bmp, bmp.width, bmp.height, PRESETS[cur], false, new Date(file.lastModified || Date.now()));
  $('#msg').hidden = true;
  showResult(c);
}
async function save(){
  if (!lastBlob) return;
  const file = new File([lastBlob], 'digicam-' + Date.now() + '.jpg', {type:'image/jpeg'});
  try{
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = lastUrl; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- UI ----------
const chips = $('#chips');
PRESETS.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'chip' + (i === cur ? ' on' : ''); b.textContent = p.name;
  b.onclick = () => {
    cur = i; $('#pname').textContent = p.name.toUpperCase();
    [...chips.children].forEach((c, j) => c.classList.toggle('on', j === i));
  };
  chips.appendChild(b);
});
$('#pname').textContent = PRESETS[cur].name.toUpperCase();

$('#shutter').onclick = capture;
$('#flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };
$('#stampBtn').onclick = e => { stamp = !stamp; e.currentTarget.classList.toggle('on', stamp); e.currentTarget.innerHTML = '날짜<br>' + (stamp ? 'ON' : 'OFF'); };
$('#album').onclick = $('#album2').onclick = () => $('#pickFile').click();
$('#native').onclick = () => $('#nativeFile').click();
$('#retry').onclick = startCam;
$('#pickFile').onchange = e => { fromFile(e.target.files[0]); e.target.value = ''; };
$('#nativeFile').onchange = e => { fromFile(e.target.files[0]); e.target.value = ''; };
$('#save').onclick = save;
$('#close').onclick = () => $('#viewer').hidden = true;
$('#last').onclick = () => { if (lastUrl) $('#viewer').hidden = false; };

startCam();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
